<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="64x64" href="{{ site.baseurl }}/assets/favicon.png">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1113" media="(prefers-color-scheme: dark)">
<style>
/* Land Terrain's own tokens (docs/design-tokens.md in the app repository), light and dark. */
:root{
  --page:#f4f2ef;          /* surface */
  --wash:#e8f5fc;          /* accentSofter */
  --card:#ffffff;          /* background */
  --text:#1c2024;          /* textPrimary */
  --muted:#676d73;         /* textSecondary */
  --rule:#e8e5e1;          /* separator */
  --accent:#0a84c6;        /* accent: marks and rules */
  --link:#0774b0;          /* accentText: links */
  --chip:rgba(255,255,255,.7);
  --chip-on:#cdebfa;       /* accentSoft */
  --chip-on-text:#075580;  /* accentOnSoft */
  --tile:#f4f2ef;
  --warn:#a3360a;          /* confidence-low text */
  --shadow:0 1px 2px rgba(28,32,36,.05), 0 10px 30px rgba(28,32,36,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0e1113;
    --wash:#13252f;
    --card:#1a1e21;
    --text:#f2f2f0;
    --muted:#9aa1a7;
    --rule:#2a2f33;
    --accent:#4db3ee;
    --link:#4db3ee;
    --chip:rgba(255,255,255,.06);
    --chip-on:#173a4d;
    --chip-on-text:#a9ddf7;
    --tile:#15191c;
    --warn:#ff8a5b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background-color:var(--page);
  background-image:linear-gradient(176deg, var(--wash) 0%, var(--page) 42%, var(--page) 100%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.rounded{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

.wrap{max-width:46rem;margin:0 auto;padding:0 18px}

header.bar{padding:30px 0 22px;text-align:center}
header.bar .icon{display:block;width:64px;height:64px;margin:0 auto 12px;border-radius:14px;box-shadow:0 1px 2px rgba(28,32,36,.08), 0 6px 18px rgba(28,32,36,.12)}
header.bar .app{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-0.02em}
header.bar .sub{margin:3px 0 0;color:var(--muted);font-size:.9rem;letter-spacing:.01em}

nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
nav a{
  display:inline-block;
  padding:7px 16px;
  border-radius:999px;
  background:var(--chip);
  color:var(--muted);
  text-decoration:none;
  font-size:.9rem;
  font-weight:500;
  transition:color .15s, background .15s;
}
nav a:hover{color:var(--link)}
nav a.here{background:var(--chip-on);color:var(--chip-on-text);font-weight:600}

main.card{
  background:var(--card);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:38px 34px 34px;
  margin-bottom:26px;
}
main.card > :first-child{margin-top:0}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:1.85rem;line-height:1.25;letter-spacing:-0.02em;margin:0 0 .65em;font-weight:800}
h2{font-size:1.26rem;margin:2.1em 0 .5em;letter-spacing:-0.01em;font-weight:750}
h3{font-size:1.04rem;margin:1.9em 0 .4em;font-weight:700}
p,li{overflow-wrap:break-word}
li{margin:.3em 0}
a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--accent)}
strong{font-weight:650}
hr{border:0;border-top:1px solid var(--rule);margin:2.3em 0}

code{
  background:var(--tile);
  color:var(--text);
  padding:.14em .4em;
  border-radius:5px;
  font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

table{border-collapse:separate;border-spacing:0;width:100%;margin:1.3em 0;font-size:.94rem}
th,td{border-bottom:1px solid var(--rule);padding:9px 12px;text-align:left;vertical-align:top}
thead th{color:var(--muted);font-weight:600;font-size:.86rem;letter-spacing:.02em;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}

blockquote{
  margin:1.3em 0;
  padding:.7em 1em;
  border-left:3px solid var(--accent);
  background:var(--tile);
  border-radius:0 12px 12px 0;
}
blockquote p{margin:.3em 0}

footer{padding:4px 0 54px;color:var(--muted);font-size:.86rem;text-align:center}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--link);text-decoration:underline}
footer p{margin:.3em 0}

@media (max-width:560px){
  .wrap{padding:0 14px}
  header.bar{padding:22px 0 16px}
  header.bar .icon{width:56px;height:56px;border-radius:12.5px;margin-bottom:10px}
  main.card{padding:26px 20px 24px;border-radius:20px}
  h1{font-size:1.5rem}
  h2{font-size:1.15rem}
  nav a{padding:6px 13px;font-size:.86rem}
  table{font-size:.88rem}
  th,td{padding:8px 8px}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="bar">
    <img class="icon" src="{{ site.baseurl }}/assets/icon.png" width="64" height="64" alt="">
    <p class="app rounded">Land Terrain</p>
    <p class="sub">Topo &amp; Drainage</p>
    <nav>
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="here"{% endif %}>Support</a>
      <a href="{{ site.baseurl }}/privacy"{% if page.url contains "privacy" %} class="here"{% endif %}>Privacy</a>
      <a href="{{ site.baseurl }}/terms"{% if page.url contains "terms" %} class="here"{% endif %}>Terms</a>
    </nav>
  </header>

  <main class="card">
{{ content }}
  </main>

  <footer>
    <p><a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a></p>
    <p>&copy; {{ site.time | date: "%Y" }} Tigran Barseghyan</p>
  </footer>

</div>

</body>
</html>
